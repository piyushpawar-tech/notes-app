<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginal — Markdown Notes Manager</title>

  <!-- Fonts: serif for reading (preview + titles), mono for writing raw markdown, sans for UI chrome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- marked.js: converts markdown text to HTML -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <!-- DOMPurify: sanitizes the generated HTML before it is injected into the page -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app">

    <!-- ============ SIDEBAR: list of saved notes ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__header">
        <div class="sidebar__brand">
          <span class="sidebar__mark">§</span>
          <span class="sidebar__name">Marginal</span>
        </div>
        <button class="btn btn--new" id="newNoteBtn" type="button">
          <span aria-hidden="true">+</span> New note
        </button>
      </div>

      <ul class="note-list" id="noteList" aria-label="Saved notes">
        <!-- Note list items are rendered here by app.js -->
      </ul>

      <p class="sidebar__empty" id="sidebarEmpty" hidden>
        No notes yet. Start one above.
      </p>
    </aside>

    <!-- Toggle for showing/hiding the sidebar on small screens -->
    <button class="btn btn--menu" id="menuToggle" type="button" aria-label="Toggle note list" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- ============ MAIN: editor + preview split pane ============ -->
    <main class="workspace">

      <div class="workspace__toolbar">
        <input
          type="text"
          id="titleInput"
          class="title-input"
          placeholder="Untitled note"
          autocomplete="off"
        />
        <div class="workspace__actions">
          <span class="save-indicator" id="saveIndicator">Saved</span>
          <button class="btn btn--danger" id="deleteNoteBtn" type="button">Delete</button>
        </div>
      </div>

      <div class="panes" id="panes">

        <!-- Raw markdown input -->
        <section class="pane pane--editor" aria-label="Markdown source">
          <header class="pane__label">Write</header>
          <textarea
            id="markdownInput"
            class="editor"
            placeholder="# Start writing…

Use Markdown: **bold**, _italics_, `code`, lists, [links](https://example.com), and more."
            spellcheck="false"
          ></textarea>
        </section>

        <!-- Stitched spine divider — the app's signature detail -->
        <div class="spine" aria-hidden="true">
          <div class="spine__stitch"></div>
        </div>

        <!-- Rendered HTML preview -->
        <section class="pane pane--preview" aria-label="Rendered preview">
          <header class="pane__label">Preview</header>
          <div id="markdownPreview" class="preview"></div>
        </section>

      </div>

      <footer class="statusbar">
        <span id="wordCount">0 words</span>
        <span class="statusbar__divider">·</span>
        <span id="charCount">0 characters</span>
        <span class="statusbar__divider">·</span>
        <span id="updatedAt">—</span>
      </footer>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
